<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; connect-src 'self' https:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PhoneBox</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Pages and widgets are built by app.js from the layout designed in the agent's settings page. -->
<div id="pager"></div>

<nav id="dots" title="All pages"></nav>
<div id="ptitle"></div>

<div id="overview" hidden>
  <div class="ov-head">All pages <small>tap one to jump · volume keys flip pages · long-press a page to come back here</small></div>
  <div id="ovGrid"></div>
</div>

<div class="p-sheet" id="pSheet" hidden>
  <div class="ps-head">
    <div class="p-ico" id="psIco"></div>
    <div class="ps-title"><b id="psTitle"></b><small id="psSub"></small></div>
    <button class="ps-btn danger" id="psAll">End all</button>
    <button class="ps-btn" id="psClose" aria-label="Close">✕</button>
  </div>
  <div class="ps-list" id="psList"></div>
</div>

<div class="p-sheet" id="cSheet" hidden>
  <div class="ps-head">
    <div class="ps-title"><b id="csTitle"></b><small id="csSub"></small></div>
    <div class="seg" id="csBars"></div>
    <div class="seg" id="csKind"><button data-k="c" class="on">Mum</button><button data-k="l">Çizgi</button></div>
    <button class="ps-btn" id="csClose" aria-label="Close">✕</button>
  </div>
  <canvas id="csCanvas"></canvas>
</div>

<div class="p-sheet" id="aSheet" hidden>
  <div class="ps-head">
    <div class="ps-title"><b>Hava Temizleyici</b><small id="asSub"></small></div>
    <button class="ps-btn" id="asClose" aria-label="Close">✕</button>
  </div>
  <div class="as-body">
    <div class="as-read"><b id="asPm">—</b><small>PM2.5</small><span id="asInfo"></span></div>
    <button class="as-power" id="asPower">⏻</button>
    <div class="seg as-modes" id="asModes"><button data-m="auto">Oto</button><button data-m="silent">Uyku</button><button data-m="favorite">Favori</button></div>
    <div class="as-level"><button id="asMinus">−</button><span><b id="asLvl">—</b><small>Favori seviye</small></span><button id="asPlus">+</button></div>
  </div>
</div>

<div id="approval" hidden>
  <div class="ap-card">
    <div class="ap-head"><span class="ap-logo">✳</span><span id="apSource">Claude Code</span><span class="ap-sep">·</span><span id="apProject"></span><span class="ap-count" id="apCount"></span></div>
    <div class="ap-tool" id="apTool"></div>
    <div class="ap-desc" id="apDesc"></div>
    <pre class="ap-detail" id="apDetail"></pre>
    <div class="ap-foot">
      <span class="ap-time" id="apTime"></span>
      <button class="ap-btn deny" id="apDeny">Deny</button>
      <button class="ap-btn allow" id="apAllow">Allow</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="offline">PC not connected</div>
<div id="night"><div id="nClock">--:--</div><div id="nDate"></div></div>

<script src="app.js"></script>
</body>
</html>
