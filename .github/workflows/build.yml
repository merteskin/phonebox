name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android panel (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: phonebox-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  agent:
    name: Agent (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, tfm: net10.0-windows10.0.19041.0 }
          - { os: ubuntu-latest, rid: linux-x64, tfm: net10.0 }
          - { os: macos-latest, rid: osx-arm64, tfm: net10.0 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish agent
        run: dotnet publish agent/PhoneBox.Agent -c Release -f ${{ matrix.tfm }} -r ${{ matrix.rid }} --self-contained false -o out --nologo
      - name: Smoke test (starts, serves the API)
        if: matrix.rid != 'win-x64'
        run: |
          chmod +x out/PhoneBoxAgent
          out/PhoneBoxAgent > agent.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8775/api/state > state.json && break; sleep 1; done
          sleep 4
          curl -sf http://127.0.0.1:8775/api/state > state.json
          curl -sf "http://127.0.0.1:8775/api/procs?top=3" > /dev/null; sleep 4
          curl -sf "http://127.0.0.1:8775/api/procs?top=3" > procs.json
          cat agent.log
          head -c 700 state.json; echo
          head -c 500 procs.json; echo
          curl -sf http://127.0.0.1:8775/api/info; echo
          # the system and process readings must work on this platform
          python3 -c "import json; s=json.load(open('state.json')); p=json.load(open('procs.json')); assert s['pc'] and s['pc']['cpu'] is not None and s['pc']['ramTotalGb'] > 0, s['pc']; assert p['groups'], p; print('cpu', s['pc']['cpu'], 'ram', s['pc']['ramUsedGb'], '/', s['pc']['ramTotalGb'], 'procs', p['total'])"
      - uses: actions/upload-artifact@v4
        with:
          name: phonebox-agent-${{ matrix.rid }}
          path: out/
